name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: finnet
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: finnet
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: finnet
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: finnet.exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build
      run: |
        cd go-app
        go build -o ${{ matrix.output }} main.go
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: finnet-${{ matrix.goos }}-${{ matrix.goarch }}
        path: go-app/${{ matrix.output }}
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: go-app/${{ matrix.output }}
