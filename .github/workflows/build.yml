name: Build Python Executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      # Força o Playwright a baixar os navegadores na pasta do repositório
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies and Playwright browsers
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller playwright playwright-stealth
          playwright install chromium

      - name: Compress Playwright browsers into browsers.zip
        shell: bash
        run: |
          # Garante que estamos na raiz do projeto antes de zipar
          cd "${{ github.workspace }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -Command "Compress-Archive -Path playwright-browsers -DestinationPath browsers.zip -Force"
          else
            zip -r browsers.zip playwright-browsers
          fi

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          # Garante que estamos na raiz do projeto antes de buildar
          cd "${{ github.workspace }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SEP=";"
          else
            SEP=":"
          fi
          pyinstaller --onefile --copy-metadata playwright --add-data "browsers.zip${SEP}." finnet.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-executable
          path: dist/finnet*
          # Vai forçar o Actions a acusar erro se o .exe/.app não estiver na pasta dist/
          if-no-files-found: error