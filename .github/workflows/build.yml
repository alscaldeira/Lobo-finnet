name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: finnet
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: finnet
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: finnet.exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'   # verifique se essa versão existe (atualmente é 1.22/1.23)

    # Instalação do MinGW para Windows
    - name: Install MinGW (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install mingw -y
        echo "C:\tools\mingw64\bin" >> $env:GITHUB_PATH

    - name: Build
      run: |
        cd go-app
        go build -o ${{ matrix.output }} main.go
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
        # Opcional, mas recomendado para macOS cross-compile
        MACOSX_DEPLOYMENT_TARGET: 10.15
        SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: finnet-${{ matrix.goos }}-${{ matrix.goarch }}
        path: go-app/${{ matrix.output }}
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: go-app/${{ matrix.output }}